<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="コちゃんトレード中">
<title>コちゃんトレード中 — Gold Signal Pro Ultra v3</title>
<style>
:root { --bg:#0b1220; --card:#131e30; --gold:#f3c969; --green:#27c58a; --red:#ff6474; --blue:#7cc4ff; --muted:#9fb0c7; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px 10px 60px;line-height:1.4}
.wrap{max-width:480px;margin:auto}
.brand{font-size:22px;font-weight:800;color:var(--gold);text-align:center;margin:8px 0 4px}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:12px}
.card{background:var(--card);border:1px solid #26364d;border-radius:16px;padding:16px;margin:10px 0}
.signal-big{font-size:42px;font-weight:900;text-align:center;padding:12px;border-radius:12px;letter-spacing:1px}
.signal-big.buy{background:rgba(39,197,138,.15);color:var(--green)}
.signal-big.sell{background:rgba(255,100,116,.15);color:var(--red)}
.signal-big.wait{background:rgba(243,201,105,.12);color:var(--gold)}
.signal-big.watch{background:rgba(124,196,255,.12);color:var(--blue)}
.score{text-align:center;font-size:28px;font-weight:800;color:var(--gold);margin:8px 0}
.reason{text-align:center;color:var(--gold);font-size:13px;min-height:36px;line-height:1.4}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.metric{background:#0b1423;padding:10px;border-radius:10px;font-size:12px}
.metric span{color:var(--muted);display:block;font-size:11px}
.metric b{display:block;margin-top:2px;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:var(--gold);color:#18202c;margin-top:8px;cursor:pointer}
button.secondary{background:#263750;color:white}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.status{font-size:12px;text-align:center;color:var(--muted);margin-top:6px}
.live{color:var(--green)}
.err{color:var(--red)}
canvas{width:100%;height:200px;background:#0b1423;border-radius:10px;margin-top:8px}
.history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #26364d;font-size:13px}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tf-box{background:#0b1423;padding:10px;border-radius:10px;text-align:center}
.tf-box .label{font-size:11px;color:var(--muted)}
.tf-box .val{font-size:18px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">コちゃんトレード中</div>
  <div class="sub">XAUUSD Ultra v3｜価格毎秒更新｜MACD・Stoch・H1/H4</div>

  <div class="card">
    <div id="signal" class="signal-big wait">WAIT</div>
    <div class="score" id="score">-- / 100</div>
    <div class="reason" id="reason">データを取得中…</div>
    <div class="status" id="status">接続中…</div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span>現在価格</span>
      <b id="price" style="font-size:24px;color:var(--gold)">--</b>
    </div>
    <canvas id="chart"></canvas>
    <div class="metrics">
      <div class="metric"><span>EMA20</span><b id="ema20">--</b></div>
      <div class="metric"><span>EMA50</span><b id="ema50">--</b></div>
      <div class="metric"><span>RSI(9)</span><b id="rsi">--</b></div>
      <div class="metric"><span>ATR(14)</span><b id="atr">--</b></div>
      <div class="metric"><span>MACD</span><b id="macd">--</b></div>
      <div class="metric"><span>Stoch %K</span><b id="stoch">--</b></div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">マルチタイムフレーム</div>
    <div class="tf-grid">
      <div class="tf-box"><div class="label">M5</div><div class="val" id="tfM5">--</div></div>
      <div class="tf-box"><div class="label">H1</div><div class="val" id="tfH1">--</div></div>
      <div class="tf-box"><div class="label">H4</div><div class="val" id="tfH4">--</div></div>
      <div class="tf-box"><div class="label">一致度</div><div class="val" id="tfAlign">--</div></div>
    </div>
  </div>

  <div class="card">
    <div class="metrics">
      <div class="metric"><span>方向</span><b id="dir">--</b></div>
      <div class="metric"><span>強度</span><b id="strength">--</b></div>
      <div class="metric"><span>推奨SL</span><b id="sl">--</b></div>
      <div class="metric"><span>推奨TP</span><b id="tp">--</b></div>
    </div>
    <button id="refresh">最新データを取得</button>
    <button class="secondary" id="auto">自動更新 OFF</button>
    <button class="secondary" id="notifyBtn">通知を有効化</button>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:700">判定履歴</span>
      <button class="secondary" style="width:auto;padding:6px 12px;margin:0;font-size:12px" id="clearHist">消去</button>
    </div>
    <div id="history">履歴はまだありません</div>
    <p class="note">BUY/SELL判定時に自動記録。通知許可時はシグナル変化で通知します。</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let autoOn = false, timer = null, priceTimer = null, points = [];
let history = JSON.parse(localStorage.getItem('kochan_hist') || '[]');
let lastNotified = '';
let lastFullAnalysis = 0;

function ema(values, period) {
  if (values.length < period) return Array(values.length).fill(null);
  const k = 2 / (period + 1);
  let e = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
  const result = Array(period - 1).fill(null);
  result.push(e);
  for (let i = period; i < values.length; i++) {
    e = values[i] * k + e * (1 - k);
    result.push(e);
  }
  return result;
}

function rsi(values, period = 9) {
  if (values.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = values[i] - values[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  gains /= period; losses /= period;
  for (let i = period + 1; i < values.length; i++) {
    const diff = values[i] - values[i - 1];
    gains = (gains * (period - 1) + Math.max(diff, 0)) / period;
    losses = (losses * (period - 1) + Math.max(-diff, 0)) / period;
  }
  if (losses === 0) return 100;
  return 100 - 100 / (1 + gains / losses);
}

function macd(values, fast = 12, slow = 26, signal = 9) {
  const emaFast = ema(values, fast);
  const emaSlow = ema(values, slow);
  const macdLine = emaFast.map((v, i) => (v != null && emaSlow[i] != null) ? v - emaSlow[i] : null);
  const signalLine = ema(macdLine.filter(v => v != null), signal);
  const lastMacd = macdLine[macdLine.length - 1];
  const lastSignal = signalLine[signalLine.length - 1];
  return { macd: lastMacd, signal: lastSignal, hist: lastMacd != null && lastSignal != null ? lastMacd - lastSignal : 0 };
}

function stochastic(highs, lows, closes, k = 14, d = 3) {
  if (closes.length < k) return { k: 50, d: 50 };
  const last = closes.length - 1;
  const sliceH = highs.slice(last - k + 1, last + 1);
  const sliceL = lows.slice(last - k + 1, last + 1);
  const hh = Math.max(...sliceH);
  const ll = Math.min(...sliceL);
  const stochK = hh === ll ? 50 : ((closes[last] - ll) / (hh - ll)) * 100;
  return { k: stochK, d: stochK };
}

function aggregateTF(points, minutes) {
  if (!points.length) return [];
  const closes = [];
  const step = Math.max(1, Math.round(minutes / 5));
  for (let i = step - 1; i < points.length; i += step) {
    closes.push(points[i].p);
  }
  return closes;
}

function tfTrend(closes) {
  if (closes.length < 20) return '中立';
  const e20 = ema(closes, 20).at(-1);
  const e50 = ema(closes, 50).at(-1);
  if (e20 == null || e50 == null) return '中立';
  return e20 > e50 ? '上昇' : e20 < e50 ? '下降' : '中立';
}

async function fetchPriceOnly() {
  try {
    const res = await fetch('https://xaus.com/api/v1/spot?compact=1');
    const data = await res.json();
    const price = data.spot_usd_oz;
    if (Number.isFinite(price)) {
      $('price').textContent = price.toFixed(2);
      $('status').textContent = 'LIVE ｜ ' + new Date().toLocaleTimeString('ja-JP');
      $('status').className = 'status live';
    }
  } catch (e) {
    // silent fail for price-only
  }
}

async function fetchData() {
  $('status').textContent = '取得中…';
  $('status').className = 'status';
  try {
    const [spotRes, intraRes] = await Promise.all([
      fetch('https://xaus.com/api/v1/spot?compact=1'),
      fetch('https://xaus.com/api/v1/intraday?hours=48')
    ]);
    const spot = await spotRes.json();
    const intra = await intraRes.json();
    const price = spot.spot_usd_oz;
    points = (intra.points || []).map(p => ({ t: p.t, p: p.p }));
    if (points.length < 50) throw new Error('データ不足');

    const closes = points.map(x => x.p);
    const highs = points.map(x => x.p * 1.0015);
    const lows = points.map(x => x.p * 0.9985);

    const e20arr = ema(closes, 20);
    const e50arr = ema(closes, 50);
    const e20 = e20arr.at(-1);
    const e50 = e50arr.at(-1);
    const rsiVal = rsi(closes, 9);
    const macdVal = macd(closes);
    const stochVal = stochastic(highs, lows, closes);
    const atrVal = Math.max(2, Math.abs(price - e20) * 0.6 || 3);

    // Multi-TF
    const m5Closes = closes;
    const h1Closes = aggregateTF(points, 60);
    const h4Closes = aggregateTF(points, 240);
    const m5Trend = tfTrend(m5Closes);
    const h1Trend = tfTrend(h1Closes);
    const h4Trend = tfTrend(h4Closes);

    $('price').textContent = price.toFixed(2);
    $('ema20').textContent = e20 ? e20.toFixed(2) : '--';
    $('ema50').textContent = e50 ? e50.toFixed(2) : '--';
    $('rsi').textContent = rsiVal.toFixed(1);
    $('atr').textContent = atrVal.toFixed(2);
    $('macd').textContent = macdVal.hist > 0 ? '+' + macdVal.hist.toFixed(2) : macdVal.hist.toFixed(2);
    $('stoch').textContent = stochVal.k.toFixed(0);

    $('tfM5').textContent = m5Trend;
    $('tfH1').textContent = h1Trend;
    $('tfH4').textContent = h4Trend;
    const aligns = [m5Trend, h1Trend, h4Trend].filter(t => t !== '中立');
    const same = aligns.length >= 2 && aligns.every(t => t === aligns[0]);
    $('tfAlign').textContent = same ? aligns[0] : '不一致';

    analyze(price, e20, e50, rsiVal, atrVal, macdVal, stochVal, { m5: m5Trend, h1: h1Trend, h4: h4Trend });
    drawChart(closes, e20arr, e50arr);
    $('status').textContent = 'LIVE ｜ ' + new Date().toLocaleTimeString('ja-JP');
    $('status').className = 'status live';
  } catch (e) {
    $('status').textContent = '取得失敗: ' + e.message;
    $('status').className = 'status err';
    $('reason').textContent = 'データ取得に失敗しました。再試行してください。';
  }
}

function analyze(price, ema20, ema50, rsi, atr, macdVal, stochVal, tfs) {
  if (!ema20 || !ema50) {
    $('signal').textContent = 'WAIT';
    $('signal').className = 'signal-big wait';
    $('score').textContent = '-- / 100';
    $('reason').textContent = '指標計算中…';
    return;
  }

  let score = 50;
  let reasons = [];

  // Trend (EMA)
  if (price > ema20 && ema20 > ema50) { score += 18; reasons.push('上昇トレンド'); }
  else if (price < ema20 && ema20 < ema50) { score -= 18; reasons.push('下降トレンド'); }
  else { reasons.push('レンジ'); }

  // RSI
  if (rsi > 52 && rsi < 68) { score += 10; reasons.push('RSI良好'); }
  else if (rsi < 48 && rsi > 32) { score -= 10; reasons.push('RSI弱気'); }
  else if (rsi >= 72) { score -= 8; reasons.push('RSI過熱'); }
  else if (rsi <= 28) { score += 8; reasons.push('RSI売られすぎ'); }

  // MACD
  if (macdVal.hist > 0) { score += 8; reasons.push('MACD陽転'); }
  else if (macdVal.hist < 0) { score -= 8; reasons.push('MACD陰転'); }

  // Stochastic
  if (stochVal.k > 20 && stochVal.k < 80) {
    if (stochVal.k > 50) score += 4;
    else score -= 4;
  } else if (stochVal.k >= 80) { score -= 6; reasons.push('Stoch過熱'); }
  else if (stochVal.k <= 20) { score += 6; reasons.push('Stoch売られすぎ'); }

  // Higher TF confirmation
  if (tfs.h1 === '上昇' && tfs.h4 === '上昇') { score += 12; reasons.push('H1/H4上昇一致'); }
  else if (tfs.h1 === '下降' && tfs.h4 === '下降') { score -= 12; reasons.push('H1/H4下降一致'); }
  else if (tfs.h1 === '上昇' || tfs.h4 === '上昇') { score += 4; }
  else if (tfs.h1 === '下降' || tfs.h4 === '下降') { score -= 4; }

  // Pullback filter
  const dist = Math.abs(price - ema20);
  if (dist < atr * 1.2) { score += 6; reasons.push('押し目圏'); }
  else { score -= 5; reasons.push('伸びすぎ'); }

  score = Math.max(0, Math.min(100, Math.round(score)));

  let signal = 'WAIT', cls = 'wait';
  if (score >= 70) { signal = 'BUY'; cls = 'buy'; }
  else if (score <= 30) { signal = 'SELL'; cls = 'sell'; }
  else if (score >= 58) { signal = 'WATCH'; cls = 'watch'; }
  else if (score <= 42) { signal = 'WATCH'; cls = 'watch'; }

  $('signal').textContent = signal;
  $('signal').className = 'signal-big ' + cls;
  $('score').textContent = score + ' / 100';
  $('reason').textContent = reasons.slice(0, 3).join(' ｜ ') || '条件確認中';
  $('dir').textContent = score > 55 ? 'BUY寄り' : score < 45 ? 'SELL寄り' : '中立';
  $('strength').textContent = score >= 70 || score <= 30 ? '強' : score >= 58 || score <= 42 ? '中' : '弱';
  $('sl').textContent = signal === 'BUY' ? (price - atr * 1.8).toFixed(1) : signal === 'SELL' ? (price + atr * 1.8).toFixed(1) : '--';
  $('tp').textContent = signal === 'BUY' ? (price + atr * 2.2).toFixed(1) : signal === 'SELL' ? (price - atr * 2.2).toFixed(1) : '--';

  // History & Notification
  if (signal === 'BUY' || signal === 'SELL') {
    const key = signal + price.toFixed(0);
    if (key !== lastNotified) {
      addHistory(signal, score, price, reasons.join(' / '));
      sendNotification(signal, score, price);
      lastNotified = key;
    }
  }
  renderHistory();
}

function addHistory(signal, score, price, reason) {
  history.unshift({
    t: new Date().toLocaleString('ja-JP', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }),
    s: signal,
    score,
    p: price.toFixed(1),
    reason: reason.slice(0, 40)
  });
  if (history.length > 30) history.pop();
  localStorage.setItem('kochan_hist', JSON.stringify(history));
}

function renderHistory() {
  if (!history.length) {
    $('history').innerHTML = '履歴はまだありません';
    return;
  }
  $('history').innerHTML = history.slice(0, 12).map(h =>
    `<div class="history-item"><span class="${h.s.toLowerCase()}" style="font-weight:700">${h.s} ${h.score}</span><span>${h.t} ｜ ${h.p}</span></div>`
  ).join('');
}

function sendNotification(signal, score, price) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  new Notification('コちゃんトレード中', {
    body: `${signal} シグナル（${score}点） 価格 ${price.toFixed(1)}`,
    tag: 'kochan-signal',
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23101827"/><polyline points="8,44 22,30 32,38 46,18 56,24" fill="none" stroke="%23f3c969" stroke-width="4"/></svg>'
  });
}

function drawChart(closes, e20, e50) {
  const cv = $('chart');
  const ctx = cv.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth;
  const h = 200;
  cv.width = w * dpr;
  cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const view = closes.slice(-80);
  const min = Math.min(...view) * 0.997;
  const max = Math.max(...view) * 1.003;
  const X = i => (i / (view.length - 1)) * (w - 8) + 4;
  const Y = v => h - 16 - ((v - min) / (max - min)) * (h - 32);

  ctx.beginPath();
  ctx.strokeStyle = '#f3c969';
  ctx.lineWidth = 2;
  view.forEach((p, i) => {
    const x = X(i), y = Y(p);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  const off = closes.length - view.length;
  function drawEma(arr, color) {
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.2;
    let started = false;
    for (let i = 0; i < view.length; i++) {
      const v = arr[off + i];
      if (v == null) continue;
      const x = X(i), y = Y(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  drawEma(e20, '#f3c969');
  drawEma(e50, '#7cc4ff');
}

$('refresh').onclick = fetchData;
$('auto').onclick = () => {
  autoOn = !autoOn;
  $('auto').textContent = '自動更新 ' + (autoOn ? 'ON' : 'OFF');
  if (autoOn) {
    // 価格は毎秒、フル分析は30秒ごと
    priceTimer = setInterval(fetchPriceOnly, 1000);
    timer = setInterval(fetchData, 30000);
    fetchData();
    fetchPriceOnly();
  } else {
    clearInterval(timer);
    clearInterval(priceTimer);
  }
};
$('notifyBtn').onclick = async () => {
  if (!('Notification' in window)) { alert('この環境は通知非対応です'); return; }
  const perm = await Notification.requestPermission();
  $('notifyBtn').textContent = perm === 'granted' ? '通知許可済み' : '通知未許可';
};
$('clearHist').onclick = () => {
  history = [];
  localStorage.removeItem('kochan_hist');
  renderHistory();
};

renderHistory();
fetchData();
</script>
</body>
</html>
