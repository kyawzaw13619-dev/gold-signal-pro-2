<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>GOLD SIGNAL PRO</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 14px 40px;background:#0b1220;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:680px;margin:auto}.brand{font-size:23px;font-weight:800;color:#f3c969;margin:8px 0}.sub,.note,label,small{color:#9fb0c7}.sub{font-size:13px}.card{background:#131e30;border:1px solid #26364d;border-radius:15px;padding:16px;margin:14px 0}h2{font-size:15px;margin:0 0 13px}.signal{font-size:34px;font-weight:800;color:#f3c969}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #33445d;background:#0b1423;color:white;font-size:16px}button{padding:13px;border:0;border-radius:10px;font-weight:700}.primary{width:100%;margin-top:14px;background:#f3c969;color:#18202c}.secondary{background:#263750;color:white}.danger{background:#482632;color:white}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#0b1423;padding:12px;border-radius:9px}.metric span{display:block;font-size:11px;color:#9fb0c7}.metric b{display:block;margin-top:5px}.entry{display:flex;justify-content:space-between;padding:9px;background:#0b1423;border-radius:8px;margin:7px 0;font-size:12px}.buy{color:#27c58a}.sell{color:#ff6474}.wait{color:#f3c969}.actions{display:flex;gap:8px}.actions button{flex:1}.note{font-size:12px;line-height:1.6}@media(min-width:560px){.metrics{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap">
<div class="brand">GOLD SIGNAL PRO</div><p class="sub">XAUUSDs · M5｜手入力による参考分析</p>
<section class="card"><small>現在の判定</small><div id="signal" class="signal wait">WAIT</div><small id="updated">まだ分析していません</small></section>
<section class="card"><h2>インジケーター入力</h2><div class="grid">
<div class="field"><label>現在価格（Bid）</label><input id="price" type="number" step="0.001" placeholder="価格"></div>
<div class="field"><label>EMA 20</label><input id="ema20" type="number" step="0.001"></div>
<div class="field"><label>EMA 50</label><input id="ema50" type="number" step="0.001"></div>
<div class="field"><label>RSI 9</label><input id="rsi" type="number" step="0.01"></div>
<div class="field"><label>ATR 14</label><input id="atr" type="number" step="0.001"></div>
<div class="field"><label>BB 中央線</label><input id="bb" type="number" step="0.001"></div>
</div><button class="primary" id="analyze">分析する</button></section>
<section class="card"><h2>分析データ</h2><div class="metrics">
<div class="metric"><span>EMA方向</span><b id="trend">—</b></div><div class="metric"><span>RSI 9</span><b id="rsiView">—</b></div>
<div class="metric"><span>参考SL幅（ATR×1.5）</span><b id="sl">—</b></div><div class="metric"><span>参考TP幅（ATR×2）</span><b id="tp">—</b></div></div>
<p class="note">試作ルール：BUY＝価格がEMA20・EMA50・BB中央線より上、EMA20＞EMA50、RSI 50〜70。SELL＝逆方向、RSI 30〜50。それ以外はWAIT。未検証で、利益を保証しません。</p></section>
<section class="card"><h2>判定履歴</h2><div id="history" class="note">履歴はまだありません。</div><div class="actions"><button class="secondary" id="csv">CSV保存</button><button class="danger" id="clear">履歴消去</button></div></section>
<p class="note">このデモはMT5・FXGTと未接続です。数値を手入力してください。自動注文は行いません。</p></main>
<script>
const ids=['price','ema20','ema50','rsi','atr','bb'];let hist=JSON.parse(localStorage.getItem('gsp_hist')||'[]');const el=id=>document.getElementById(id);
function show(){el('history').innerHTML=hist.length?hist.slice(0,20).map(x=>'<div class="entry"><b class="'+x.s.toLowerCase()+'">'+x.s+'</b><span>'+x.t+'｜'+x.p+'</span></div>').join(''):'履歴はまだありません。'}
el('analyze').onclick=()=>{let v={};for(let id of ids){if(el(id).value.trim()===''){alert('すべての項目に数値を入力してください');el(id).focus();return}v[id]=Number(el(id).value);if(!Number.isFinite(v[id]))return}
if(v.rsi<0||v.rsi>100||v.atr<0){alert('RSIは0〜100、ATRは0以上で入力してください');return}
let s='WAIT';if(v.price>v.ema20&&v.price>v.ema50&&v.price>v.bb&&v.ema20>v.ema50&&v.rsi>=50&&v.rsi<=70)s='BUY';else if(v.price<v.ema20&&v.price<v.ema50&&v.price<v.bb&&v.ema20<v.ema50&&v.rsi>=30&&v.rsi<=50)s='SELL';
el('signal').textContent=s;el('signal').className='signal '+s.toLowerCase();el('updated').textContent='更新：'+new Date().toLocaleString('ja-JP');el('trend').textContent=v.ema20>v.ema50?'上向き':v.ema20<v.ema50?'下向き':'横ばい';el('rsiView').textContent=v.rsi.toFixed(2);el('sl').textContent=(v.atr*1.5).toFixed(3);el('tp').textContent=(v.atr*2).toFixed(3);hist.unshift({s,t:new Date().toLocaleString('ja-JP'),p:v.price});hist=hist.slice(0,100);localStorage.setItem('gsp_hist',JSON.stringify(hist));show()};
el('clear').onclick=()=>{if(confirm('履歴を消去しますか？')){hist=[];localStorage.removeItem('gsp_hist');show()}};
el('csv').onclick=()=>{if(!hist.length){alert('履歴がありません');return}let csv='\uFEFF判定,日時,価格\n'+hist.map(x=>[x.s,x.t,x.p].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='gold-signal-history.csv';a.click();URL.revokeObjectURL(a.href)};show();
</script></body></html>
